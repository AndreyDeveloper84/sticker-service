{% extends "admin/base_site.html" %}
{% block content %}
  <div id="content-main">
    <p><strong>Order #{{ order.pk }}</strong> · {{ order.get_status_display }}</p>
    <p>{{ detail }}</p>
    <form method="post" action="{{ action_url }}">
      {% csrf_token %}
      {% if slot_input %}
        <p>
          <label for="slot_keys">Slot keys (через запятую):</label>
          <input type="text" id="slot_keys" name="slot_keys" value="{{ slot_keys_value }}" size="40">
        </p>
      {% endif %}
      <input type="submit" value="Подтвердить">
      <a href="{% url 'admin:core_order_change' order.pk %}">Отмена</a>
    </form>
  </div>
{% endblock %}
