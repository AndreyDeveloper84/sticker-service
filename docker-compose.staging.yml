# Staging stack for the sticker-service.
#
# Only nginx is published to the internet. db / redis / backend stay on the
# internal compose network. Secrets come from a server-side .env.staging file
# (never committed); run commands via:
#   docker compose --env-file .env.staging -f docker-compose.staging.yml ...

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # no ports: PostgreSQL is not published outside the compose network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    # no ports: Redis is not published outside the compose network

  backend:
    build: .
    # explicit name so the worker can reuse the very same image (one build
    # per deploy, one SHA for web and worker)
    image: sticker-service-backend
    restart: unless-stopped
    env_file:
      # optional so `docker compose -f docker-compose.staging.yml config`
      # validates without secrets; deploy.sh fails fast if the file is missing
      - path: .env.staging
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.staging
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      # generation queue on its own logical DB: cache traffic / a FLUSHDB on
      # DB 0 can never drop queued job ids. Must match the worker below.
      GENERATION_QUEUE_REDIS_URL: redis://redis:6379/1
      MEDIA_ROOT: /app/media
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3}
      --timeout 300
      --access-logfile -
      --error-logfile -
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # no ports: backend is reachable only through nginx

  # Background generation worker (RQ, queue "generation"). Runs even while
  # GENERATION_WORKER_ENABLED is false (then it simply idles, ~100 MiB) so
  # enabling the flag later is an env change + backend recreate, not a
  # topology change. Exactly ONE instance: the fixed --name makes RQ refuse a
  # second worker with the same name, and the DB claim (PENDING→RUNNING under
  # select_for_update) is the real at-most-once gate. Never scale this service.
  worker:
    image: sticker-service-backend
    restart: unless-stopped
    env_file:
      - path: .env.staging
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.staging
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      GENERATION_QUEUE_REDIS_URL: redis://redis:6379/1
      MEDIA_ROOT: /app/media
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py generation_worker --name sticker-generation-1
    # Shared VPS: cap the worker so a leak or a huge decode can never squeeze
    # the neighbours. Idle ~100 MiB, peak (1254² PNG + forked work-horse)
    # well under 512 MiB. No swap creep.
    mem_limit: 512m
    memswap_limit: 512m
    # A redeploy sends SIGTERM: RQ warm shutdown finishes the in-flight
    # provider call (OpenAI read timeout ≤ 540 s) before exiting. Only then
    # does compose recreate the container — a paid call is never killed.
    stop_grace_period: 600s
    healthcheck:
      # heartbeat-based (no HTTP, no ports): the worker registers in Redis
      # and refreshes its heartbeat every worker_ttl-15 = 105 s while idle,
      # every 30 s while busy → max-age 150 with 3 retries flags a dead
      # worker within ~4 min without flapping on an idle one
      test: ["CMD", "python", "manage.py", "worker_health", "--max-age", "150"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # shared VPS: host nginx owns 80/443 and proxies to this loopback port.
      # TLS is terminated by host nginx later (once DNS is ready), never here.
      - "127.0.0.1:8015:80"
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:-_}
    # media_data is intentionally NOT mounted here: order photos and generated
    # assets must not be publicly reachable by URL. Delivery to customers goes
    # through the bot APIs; operators use the authenticated Production Console.
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static_data:/usr/share/nginx/static:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 explicitly: busybox wget resolves localhost to ::1 first,
      # while this nginx listens on IPv4 only
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
  media_data:
  static_data:
